name: prima-motor-pos

services:
  pm-pocketbase:
    image: nxtgencat/pocketbase:latest
    container_name: pm-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./Backend/pb_data:/pocketbase/pb_data
      - ./Backend/pb_hooks:/pocketbase/pb_hooks
      - ./Backend/pb_migrations:/pocketbase/pb_migrations
    networks:
      - pm-network

  pm-laravel-api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: pm-laravel-api
    restart: unless-stopped
    volumes:
      - ./Backend:/var/www/html
      - ./Backend/pb_data:/var/www/html/pb_data
      - ./Backend/storage:/var/www/html/storage
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/pb_data/data.db
    networks:
      - pm-network

  pm-nginx:
    image: nginx:alpine
    container_name: pm-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8080:80"
    volumes:
      - ./Frontend/dist:/var/www/html/frontend
      - ./Backend:/var/www/html
      - ./Backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pm-laravel-api
      - pm-pocketbase
    networks:
      - pm-network

networks:
  pm-network:
    driver: bridge
