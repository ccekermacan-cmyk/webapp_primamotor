name: prima-motor-pos

services:
  pm-pocketbase:
    image: nxtgencat/pocketbase:latest
    container_name: pm-pocketbase
    restart: unless-stopped
    env_file: ./datasource
    ports:
      - "${PB_HOST_PORT:?Use ./compose}:8090"
    volumes:
      - ${PB_DATA_DIR:?Use ./compose}:/pocketbase/pb_data
      - ./Backend/pb_hooks:/pocketbase/pb_hooks
      - ./Backend/pb_migrations:/pocketbase/pb_migrations
    networks:
      - pm-network

  pm-laravel-api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: pm-laravel-api
    restart: unless-stopped
    env_file: ./datasource
    volumes:
      - ./Backend:/var/www/html
      - ${PB_DATA_DIR:?Use ./compose}:/var/www/html/pb_data
      - ./Backend/storage:/var/www/html/storage
    networks:
      - pm-network

  pm-nginx:
    image: nginx:alpine
    container_name: pm-nginx
    restart: unless-stopped
    env_file: ./datasource
    ports:
      - "${API_HOST_PORT:?Use ./compose}:80"
      - "${WEB_HOST_PORT:?Use ./compose}:80"
    volumes:
      - ./Frontend/dist:/var/www/html/frontend
      - ./Backend:/var/www/html
      - ./Backend/docker/nginx/default.conf:/etc/nginx/templates/default.conf.template
    depends_on:
      - pm-laravel-api
      - pm-pocketbase
    networks:
      - pm-network

networks:
  pm-network:
    driver: bridge
